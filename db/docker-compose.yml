services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: resqdrive-postgres
    environment:
      POSTGRES_DB: resqdrive
      POSTGRES_USER: resqdrive_user
      POSTGRES_PASSWORD: resqdrive_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: